name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository safety
        run: | # pragma: allowlist secret
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '^(\.git|target)/' \
            --exclude-lines '^slint(-build)? = .*rev = "[0-9a-f]{40}".*$' \
            > /tmp/ferrink-scan.json
          result_count="$(jq '.results | length' /tmp/ferrink-scan.json)"
          if (( result_count > 0 )); then
            echo "Potential findings were detected (candidate values are hidden):"
            jq -r \
              '.results | to_entries[] | "\(.key): \([.value[].type] | unique | join(", "))"' \
              /tmp/ferrink-scan.json
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Audit public source
        run: tools/audit-public-source
